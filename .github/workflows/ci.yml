name: Test, build and publish
on:
  push:
  pull_request:
  # 手動実行はテストとビルドのみ。公開は main への push で実行する。
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make test test-race

  publish:
    needs: verify
    uses: home-lab-ksera/home-lab-k8s/.github/workflows/publish-harbor.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      image_name: nature-remo
